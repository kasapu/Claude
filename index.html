<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Notes</h1>
            <p class="subtitle">Keep track of your daily thoughts and tasks</p>
        </header>

        <main>
            <div class="note-input-section">
                <div class="date-selector">
                    <label for="note-date">Date:</label>
                    <input type="date" id="note-date" />
                </div>

                <div class="note-editor">
                    <textarea
                        id="note-content"
                        placeholder="Write your notes here..."
                        rows="10"
                    ></textarea>
                </div>

                <div class="button-group">
                    <button id="save-btn" class="btn btn-primary">Save Note</button>
                    <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    <button id="delete-btn" class="btn btn-danger">Delete Note</button>
                </div>
            </div>

            <div class="notes-list-section">
                <h2>Saved Notes</h2>
                <div id="notes-list" class="notes-list">
                    <p class="empty-state">No notes saved yet. Start writing!</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
